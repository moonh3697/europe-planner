/* ---------- server (Apps Script) ---------- */
async function api(body,timeoutMs){
  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeoutMs||20000);let res;
  try{res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctrl.signal})}
  catch(e){throw new Error(e.name==="AbortError"?"timeout":"network")}finally{clearTimeout(timer)}
  if(!res.ok)throw new Error("HTTP "+res.status);
  const t=await res.text();try{return JSON.parse(t)}catch(e){throw new Error("not_json")}
}
function errText(e){const m=e&&e.message||"";
  if(m==="not_json")return "서버가 올바른 응답을 주지 않았어요. Apps Script 배포 설정(액세스: 모든 사용자)과 새 버전 배포를 확인해 주세요.";
  if(m==="timeout")return "서버 응답이 너무 느려요. 잠시 뒤 다시 시도해 주세요.";
  if(m.startsWith("HTTP"))return "서버 오류("+m+"). Apps Script 주소를 확인해 주세요.";
  return "서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요."}

/* ---------- shared save: one sheet entry per day ---------- */
const lastSynced={},dirty=new Set();let flushing=false,flushTimer=null;
const dayBody=d=>JSON.stringify(d.s);
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}
  days.forEach(d=>{if(lastSynced[d.n]!==dayBody(d))dirty.add(d.n)});
  if(password&&dirty.size){setSync("저장하는 중…");clearTimeout(flushTimer);flushTimer=setTimeout(flush,700)}
}
async function flush(){
  if(flushing||!password)return;flushing=true;
  try{
    while(dirty.size){
      const n=[...dirty][0],d=days.find(x=>x.n===n),body=dayBody(d);
      const r=await api({action:"save",pw:password,legId:"plan_d"+n,data:{json:body,updatedAt:stamp()}});
      if(!r||!r.ok){if(r&&(r.reason==="bad_password"||r.reason==="setup")){lockAgain(r.reason);return}throw new Error("save")}
      lastSynced[n]=body;if(dayBody(d)===body)dirty.delete(n);
    }
    setSync("공유 저장됨 ("+stamp()+")");
  }catch(e){setSync("공유 저장에 실패했어요. 이 기기에는 저장돼 있어요. 연결을 확인하고 다시 고쳐 주세요.",true)}
  finally{flushing=false;if(dirty.size&&password){clearTimeout(flushTimer);flushTimer=setTimeout(flush,4000)}}
}
function applyRemote(bk){
  let changed=false;
  days.forEach(d=>{
    const r=bk&&bk["plan_d"+d.n];if(!r||!r.json||dirty.has(d.n))return;
    let arr;try{arr=JSON.parse(r.json)}catch(e){return}
    if(!Array.isArray(arr))return;
    const body=JSON.stringify(arr);lastSynced[d.n]=body;
    if(body!==dayBody(d)){d.s=arr;changed=true}
  });
  if(changed){try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}}
  return changed;
}
async function loadAll(){
  if(!password)return;setSync("불러오는 중…");
  try{
    const r=await api({action:"get",pw:password});
    if(!r.ok){lockAgain(r.reason);return}
    if(applyRemote(r.bookings))render();
    setSync("마지막으로 불러온 시각 "+stamp());
  }catch(e){setSync(errText(e),true)}
}

function showApp(){$("lock").hidden=true;$("toolbar").hidden=false;$("app").hidden=false;setTimeout(()=>{if(LM)LM.invalidateSize();drawMap()},50)}
function lockAgain(reason){
  const wasIn=password!==null||storeGet()!==null;password=null;storeDel();
  $("app").hidden=true;$("toolbar").hidden=true;$("lock").hidden=false;
  const m=$("lock-msg");m.className="msg err";
  m.textContent=reason==="setup"?"저장소에 아직 비밀번호가 정해지지 않았어요. 만든 사람에게 알려 주세요.":wasIn?"비밀번호가 바뀌었을 수 있어요. 일행에게 새 비밀번호를 물어보고 넣어 주세요.":"비밀번호가 맞지 않아요. 다시 넣어 주세요."}
async function unlock(pw){
  const m=$("lock-msg"),b=$("pw-btn");m.className="msg";m.textContent="확인하는 중…";b.disabled=true;pw=String(pw||"").trim();
  try{
    let r=await api({action:"get",pw});
    if(!r.ok&&r.reason!=="setup"&&pw!==pw.toLowerCase()){const r2=await api({action:"get",pw:pw.toLowerCase()});if(r2.ok){r=r2;pw=pw.toLowerCase()}}
    if(!r.ok){lockAgain(r.reason);return}
    password=pw;storeSet(pw);m.textContent="";applyRemote(r.bookings);showApp();render();setSync("마지막으로 불러온 시각 "+stamp());
  }catch(e){m.className="msg err";m.textContent=errText(e)}finally{b.disabled=false}
}

function drawMap(){
  const d=D(),pts=[];d.s.forEach((s,i)=>{const c=ll(s);if(c)pts.push({i,s,c})});
  const n=d.s.length,miss=n-pts.length,q=s=>encodeURIComponent(s.query||s.name);
  $("mapnote").textContent=!n?"":!LM?"지도 라이브러리를 불러오지 못했어요. 구글 지도 버튼을 이용해 주세요.":"선은 장소 사이 직선이에요. 실제 길은 구글 지도 버튼으로 확인하세요."+(miss?" 위치를 모르는 "+miss+"곳은 지도에서 빠졌어요.":"");
  const gl=$("glinks");gl.textContent="";
  if(n===1){const a=document.createElement("a");a.className="ib";a.target="_blank";a.rel="noopener";a.href="https://www.google.com/maps/search/?api=1&query="+q(d.s[0]);a.textContent="구글 지도에서 열기";gl.append(a)}
  for(let a0=0;a0<n-1;a0+=9){const ch=d.s.slice(a0,a0+10),a=document.createElement("a");a.className="ib";a.target="_blank";a.rel="noopener";
    a.href="https://www.google.com/maps/dir/?api=1&origin="+q(ch[0])+"&destination="+q(ch[ch.length-1])+(ch.length>2?"&waypoints="+ch.slice(1,-1).map(q).join("%7C"):"");
    a.textContent="구글 지도로 동선 열기"+(n>10?" ("+(a0+1)+"~"+(a0+ch.length)+"번)":"");gl.append(a)}
  if(!LM)return;
  lmLayer.clearLayers();if(!pts.length)return;
  const ls=pts.map(p=>p.c);
  L.polyline(ls,{color:"#1f6f55",weight:3,dashArray:"6 6",opacity:.85}).addTo(lmLayer);
  pts.forEach(p=>{
    const ic=L.divIcon({className:"",html:'<div class="lm'+(p.i===0?" f":"")+'">'+(p.i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
    const m=L.marker(p.c,{icon:ic,title:(p.i+1)+". "+p.s.name}).addTo(lmLayer);
    const tt=document.createElement("span");tt.textContent=p.s.name;m.bindTooltip(tt,{direction:"top",offset:[0,-12]});
    m.on("click",()=>goStop(p.i));
  });
  if(ls.length===1)LM.setView(ls[0],15);else LM.fitBounds(L.latLngBounds(ls),{padding:[30,30],maxZoom:16});
}

/* ---------- AI (through Apps Script) ---------- */
async function askAI(prompt){
  const r=await api({action:"ask",pw:password,prompt,json:true},60000);
  if(r&&!r.ok&&(r.reason==="bad_password"||r.reason==="setup")){lockAgain(r.reason);throw new Error("locked")}
  if(!r||!r.ok){const e=new Error("ai");e.reason=r&&r.reason;e.detail=r&&r.detail;throw e}
  let t=String(r.text||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw new Error("bad");
  return JSON.parse(t.slice(a,b+1));
}
function aiErr(e){
  if(e&&e.message==="locked")return "";
  if(e&&e.reason==="bad_request")return "서버에 AI 기능(ask)이 아직 없어요. Apps Script에 AI 코드를 추가하고 새 버전으로 배포해 주세요.";
  if(e&&e.reason==="no_key")return "서버에 Gemini 키가 없어요. 스크립트 속성에 GEMINI_API_KEY를 저장해 주세요.";
  if(e&&e.reason==="ai_error")return "AI 서버 오류: "+(e.detail||"알 수 없음");
  if(e&&e.message==="bad")return "AI 답변을 이해하지 못했어요. 요청을 조금 더 구체적으로 써서 다시 눌러 주세요.";
  return errText(e)}
const cleanStop=x=>{const o={name:String(x.name),query:String(x.query||x.name),memo:String(x.memo||"")};
  if(/^\d{1,2}:\d{2}$/.test(String(x.time||"")))o.time=String(x.time).padStart(5,"0");
  const la=Number(x.lat),lo=Number(x.lng);if(isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180&&(la||lo))o.ll=[la,lo];return o};
function status(t,err){const s=$("status");s.textContent=t;s.className=err?"err":""}
$("go").onclick=async()=>{
  const req=$("req").value.trim();if(!req){status("요청 내용을 입력해 주세요.",true);return}
  const go=$("go");go.disabled=true;$("prev").hidden=true;pending=null;status("AI가 일정을 보고 있어요… (10~30초)");
  try{
    const all=days.map(d=>"Day "+d.n+" ("+d.l+"): "+(d.s.map(s=>s.name).join(" > ")||"(비어 있음)")).join("\n");
    const r=await askAI("너는 4인 유럽 여행(2026-12-12~2027-01-07, 이탈리아·스위스·프랑스·스페인·포르투갈) 일정 편집 도우미야.\n[전체 일정]\n"+all+"\n\n[사용자가 보고 있는 날] Day "+cur+"\n"+JSON.stringify(D().s.map(s=>({name:s.name,query:s.query,memo:s.memo})))+"\n\n[요청] "+req+"\n\n"
      +"규칙: 요청에 필요한 날만 바꾸고, 바뀌는 날은 그날의 최종 장소 목록 전체를 내놓아. 특정 날을 말하지 않으면 사용자가 보고 있는 날을 바꿔. 숙소·교통(공항, 역) 항목은 요청이 없으면 유지해. 장소명은 한글, query는 구글맵에서 검색되는 영문/현지어(도시 포함), memo는 짧은 한국어 팁(영업시간·예약 필요 여부는 확실하지 않으면 확인 필요라고 적어). 실존하는 장소만 쓰고 lat/lng에는 대략적인 위도·경도 숫자를 넣어. 아래 JSON만 출력해: "
      +'{"summary":"무엇을 왜 바꿨는지 1~2문장","days":{"3":[{"name":"","query":"","memo":"","lat":0,"lng":0}]}}');
    const out={};if(!r||typeof r.days!=="object")throw new Error("bad");
    for(const k of Object.keys(r.days)){const n=Number(k);if(!(n>=1&&n<=27)||!Array.isArray(r.days[k]))continue;out[n]=r.days[k].filter(s=>s&&s.name).map(cleanStop)}
    if(!Object.keys(out).length)throw new Error("bad");
    pending=out;showPrev(String(r.summary||""));status("");
  }catch(e){status(aiErr(e),true)}finally{go.disabled=false}
};
function showPrev(sum){
  const p=$("prev");p.textContent="";p.hidden=false;const s=document.createElement("div");s.textContent=sum||"AI가 아래처럼 바꾸자고 제안했어요.";p.append(s);
  Object.keys(pending).forEach(n=>{const d=days.find(x=>x.n===Number(n));const b=document.createElement("b");b.textContent="Day "+n+" ("+d.l+") → "+pending[n].length+"곳 (현재 "+d.s.length+"곳)";
    const ul=document.createElement("ul");pending[n].forEach(x=>{const li=document.createElement("li");li.textContent=x.name+(x.memo?" — "+x.memo:"");ul.append(li)});p.append(b,ul)});
  const row=document.createElement("div");row.className="row";
  const ok=document.createElement("button");ok.type="button";ok.className="btn";ok.textContent="이대로 적용";
  ok.onclick=()=>{snap();Object.keys(pending).forEach(n=>{days.find(x=>x.n===Number(n)).s=pending[n]});pending=null;save();p.hidden=true;status("적용했어요. 마음에 안 들면 되돌리기를 누르세요.");render()};
  const no=document.createElement("button");no.type="button";no.className="btn ghost";no.textContent="취소";no.onclick=()=>{pending=null;p.hidden=true};
  row.append(ok,no);p.append(row);
}

/* ---------- replan tab ---------- */
function tab(t){$("v-day").hidden=t!=="day";$("v-plan").hidden=t!=="plan";$("tb-day").className=t==="day"?"on":"";$("tb-plan").className=t==="plan"?"on":"";
  if(t==="plan")syncPlanDay();if(t==="day")setTimeout(()=>{if(LM){LM.invalidateSize();drawMap()}},60)}
$("tb-day").onclick=()=>tab("day");$("tb-plan").onclick=()=>tab("plan");
days.forEach(d=>{const o=document.createElement("option");o.value=d.n;o.textContent="Day "+d.n+" ("+d.l+")";$("pday").append(o)});
function syncPlanDay(){const s=$("pday");if(s.value!==String(cur)&&!pplan)s.value=cur}
function pstatus(t,e){const el=$("pstatus");el.textContent=t;el.className=e?"err":""}
$("pform").onsubmit=async e=>{
  e.preventDefault();const n=Number($("pday").value),d=days.find(x=>x.n===n),go=$("pgo");
  if(!d.s.length&&$("pnew").value!=="yes"&&!$("pmust").value.trim()){pstatus("이 날은 비어 있어요. '새 장소도 추가'로 바꾸거나 꼭 넣을 곳을 적어 주세요.",true);return}
  go.disabled=true;$("pprev").hidden=true;pplan=null;pstatus("AI가 동선을 계산하고 있어요… (10~30초)");
  try{
    const items=d.s.map(x=>{const c=ll(x);return{name:x.name,query:x.query,memo:x.memo,lat:c?c[0]:null,lng:c?c[1]:null}});
    const pd=days.find(x=>x.n===n-1),nd=days.find(x=>x.n===n+1),edge=(x,last)=>x&&x.s.length?x.s[last?x.s.length-1:0].name:"없음";
    const r=await askAI("너는 유럽 여행 일정 최적화 도우미야. 4인 여행(2026-12-12~2027-01-07). 아래 하루를 이동 동선이 가장 효율적이 되도록 다시 짜줘.\n[날짜] Day "+n+" ("+d.l+", 겨울)\n[전날 마지막 장소] "+edge(pd,true)+"\n[다음날 첫 장소] "+edge(nd,false)+"\n[현재 장소(위도·경도 포함)]\n"+JSON.stringify(items)+"\n\n"
      +"[조건] 시작 "+$("pst").value+", 마무리 "+$("pen").value+", 이동 "+$("pmode").value+", 강도 "+$("ppace").value+", 새 장소 "+($("pnew").value==="yes"?"식사·카페 등 필요한 곳을 추가해도 됨":"추가하지 말고 현재 장소만 재배치")
      +"\n[꼭 넣을 곳] "+($("pmust").value||"없음")+"\n[뺄 곳] "+($("pskip").value||"없음")+"\n[추가 요청] "+($("pnote").value||"없음")+"\n\n"
      +"규칙: 지리적으로 가까운 장소끼리 묶고 지그재그 이동을 줄여. 숙소는 보통 처음과 끝에 두고, 공항·역 같은 교통 항목은 유지해. 점심(12~14시)·저녁(18~20시) 시간대를 고려해. 요일·겨울 영업시간상 문제가 있거나 예약이 필요한 곳은 memo에 쓰고, 확실하지 않으면 '확인 필요'라고 적어. time은 HH:MM, memo는 짧은 한국어(이동 방법·소요 시간·팁), 실존하는 장소만, lat/lng는 대략적인 위도·경도 숫자. 아래 JSON만 출력해: "
      +'{"summary":"동선을 어떻게 바꿨는지 2문장 이내","stops":[{"time":"09:00","name":"","query":"","memo":"","lat":0,"lng":0}]}');
    if(!r||!Array.isArray(r.stops))throw new Error("bad");
    const ns=r.stops.filter(x=>x&&x.name).map(cleanStop);if(!ns.length)throw new Error("bad");
    pplan={n,stops:ns};pstatus("");showPlan(String(r.summary||""),d);
  }catch(err){pstatus(aiErr(err),true)}finally{go.disabled=false}
};
function showPlan(sum,d){
  const p=$("pprev");p.textContent="";p.hidden=false;
  const h=document.createElement("b");h.textContent="Day "+d.n+" 새 일정 · "+d.s.length+"곳 → "+pplan.stops.length+"곳";
  const sm=document.createElement("div");sm.textContent=sum;const ol=document.createElement("ol");
  pplan.stops.forEach(x=>{const li=document.createElement("li");li.textContent=(x.time?x.time+"  ":"")+x.name;if(x.memo){const m=document.createElement("small");m.textContent=" — "+x.memo;li.append(m)}ol.append(li)});
  const row=document.createElement("div");row.className="row";
  const ok=document.createElement("button");ok.type="button";ok.className="btn";ok.textContent="이 일정으로 적용";
  ok.onclick=()=>{snap();days.find(x=>x.n===pplan.n).s=pplan.stops;cur=pplan.n;pplan=null;p.hidden=true;save();pstatus("적용했어요. 일정·지도 탭에서 확인하세요. 마음에 안 들면 되돌리기를 누르세요.");render();tab("day")};
  const no=document.createElement("button");no.type="button";no.className="btn ghost";no.textContent="취소";no.onclick=()=>{pplan=null;p.hidden=true};
  row.append(ok,no);p.append(h,sm,ol,row);
}

render();
const saved=storeGet();if(saved)unlock(saved);
