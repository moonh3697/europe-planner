async function geoSearch(text,nb,wide){   // 한 가지 검색어로 찾기: Nominatim → (없으면) Photon. 앞뒤 장소(nb) 근처 결과만 인정
  const near=x=>okLL(x)&&(!nb||hav(x,nb)<(wide?300:40));
  try{
    let url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q="+encodeURIComponent(text);
    if(nb&&!wide){const dd=0.3;url+="&viewbox="+[nb[1]-dd,nb[0]+dd,nb[1]+dd,nb[0]-dd].join(",")+"&bounded=1"}
    const j=await (await fetch(url)).json();
    const c=(Array.isArray(j)?j:[]).map(x=>[+x.lat,+x.lon]).find(near);if(c)return c;
  }catch(e){}
  await sleep(300);
  try{
    let url="https://photon.komoot.io/api/?limit=6&q="+encodeURIComponent(text);
    if(nb)url+="&lat="+nb[0]+"&lon="+nb[1];
    const j=await (await fetch(url)).json();
    const c=((j&&j.features)||[]).map(f=>f.geometry&&f.geometry.coordinates?[+f.geometry.coordinates[1],+f.geometry.coordinates[0]]:null).find(near);if(c)return c;
  }catch(e){}
  return null;
}
async function geocodeMissing(){   // 좌표가 없거나 수상한 장소를 지명으로 찾아 일정에 함께 저장(친구들 화면에도 보임)
  if(geoBusy)return;geoBusy=true;let found=false,changed=false;
  try{
    const near=(d,i,dir)=>{for(let k=i+dir;k>=0&&k<d.s.length;k+=dir){const c=ll(d.s[k]);if(c&&!d.s[k].__bad)return c}return null};
    days.forEach(d=>d.s.forEach((s,i)=>{   // 앞뒤 장소와 모두 80km 넘게 떨어진 직접 입력 좌표는 AI가 잘못 준 값으로 보고 지움
      if(!s.ll||COORDS[s.query])return;const pv=near(d,i,-1),nx=near(d,i,1);
      if((pv||nx)&&(!pv||hav(s.ll,pv)>80)&&(!nx||hav(s.ll,nx)>80)){delete s.ll;changed=true}
    }));
    const jobs=[];
    days.forEach(d=>d.s.forEach((s,i)=>{
      if(ll(s)||geoTried.has(s.query))return;geoTried.add(s.query);
      jobs.push({s,nb:near(d,i,-1)||near(d,i,1),nbs:[near(d,i,1),near(d,i,-1)].filter(Boolean)});
    }));
    for(const {s,nb,nbs} of jobs){
      const q=String(s.query||s.name||""),head=q.split(",")[0].trim(),tail=q.split(",").slice(1).join(",").trim();
      const city=nearestCity(nb),w=t=>city&&!t.toLowerCase().includes(city.toLowerCase())?t+" "+city:t;   // 모든 검색어에 도시 이름을 붙임
      const tries=[...new Set([GEOQ[s.query],q,w(q),head+(tail?" "+tail:""),w(head),w(String(s.name||""))].filter(Boolean))];
      const plan=[];tries.forEach(t=>{plan.push([t,nb,false]);nbs.forEach(b=>{if(b!==nb)plan.push([t,b,false])})});   // 앞 장소 근처 → 뒤 장소 근처
      [q,head,String(s.name||"")].filter(Boolean).forEach(t=>nbs.forEach(b=>{const cy=nearestCity(b);plan.push([cy&&!t.toLowerCase().includes(cy.toLowerCase())?t+" "+cy:t,b,true])}));   // 마지막: 다른 도시(300km 이내)까지 넓게
      for(const [t,nb2,wide] of plan){
        const c=await geoSearch(t,nb2,wide);await sleep(1100);
        if(c){const v=[+c[0].toFixed(5),+c[1].toFixed(5)];geoCache[s.query]=v;
          days.forEach(d=>d.s.forEach(x=>{if(x.query===s.query&&!x.ll&&!COORDS[x.query]){x.ll=v}}));   // 일정에 저장 → 모두에게 공유
          found=true;changed=true;try{localStorage.setItem("eu-geo-v2",JSON.stringify(geoCache))}catch(e){}break}
      }
    }
  }finally{geoBusy=false}
  if(changed)save();
  if(found||changed)drawMap();
}

async function flush(){
  if(flushing||!password)return;flushing=true;
  try{
    while(dirty.size){
      const n=[...dirty][0],d=days.find(x=>x.n===n),body=dayBody(d);
      const r=await api({action:"save",pw:password,legId:"plan_d"+n,data:{json:body,updatedAt:stamp()}});
      if(!r||!r.ok){if(r&&(r.reason==="bad_password"||r.reason==="setup")){lockAgain(r.reason);return}throw new Error("save")}
      lastSynced[n]=body;if(dayBody(d)===body)dirty.delete(n);
    }
    setSync("공유 저장됨 ("+stamp()+")");
  }catch(e){setSync("공유 저장에 실패했어요. 이 기기에는 저장돼 있어요. 연결을 확인하고 다시 고쳐 주세요.",true)}
  finally{flushing=false;if(dirty.size&&password){clearTimeout(flushTimer);flushTimer=setTimeout(flush,4000)}}
}
function applyRemote(bk){
  let changed=false;
  days.forEach(d=>{
    const r=bk&&bk["plan_d"+d.n];if(!r||!r.json||dirty.has(d.n))return;
    let arr;try{arr=JSON.parse(r.json)}catch(e){return}
    if(!Array.isArray(arr))return;
    const body=JSON.stringify(arr);lastSynced[d.n]=body;
    if(body!==dayBody(d)){d.s=arr;changed=true}
  });
  if(changed){try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}}
  return changed;
}
async function loadAll(){
  if(!password)return;setSync("불러오는 중…");
  try{
    const r=await api({action:"get",pw:password});
    if(!r.ok){lockAgain(r.reason);return}
    if(applyRemote(r.bookings))render();
    setSync("마지막으로 불러온 시각 "+stamp());
  }catch(e){setSync(errText(e),true)}
}

function lockAgain(reason){
  const wasIn=password!==null||storeGet()!==null;password=null;storeDel();
  $("app").hidden=true;$("toolbar").hidden=true;$("lock").hidden=false;
  const m=$("lock-msg");m.className="msg err";
  m.textContent=reason==="setup"?"저장소에 아직 비밀번호가 정해지지 않았어요. 만든 사람에게 알려 주세요.":wasIn?"비밀번호가 바뀌었을 수 있어요. 일행에게 새 비밀번호를 물어보고 넣어 주세요.":"비밀번호가 맞지 않아요. 다시 넣어 주세요."}
async function unlock(pw){
  const m=$("lock-msg"),b=$("pw-btn");m.className="msg";m.textContent="확인하는 중…";b.disabled=true;pw=String(pw||"").trim();
  try{
    let r=await api({action:"get",pw});
    if(!r.ok&&r.reason!=="setup"&&pw!==pw.toLowerCase()){const r2=await api({action:"get",pw:pw.toLowerCase()});if(r2.ok){r=r2;pw=pw.toLowerCase()}}
    if(!r.ok){lockAgain(r.reason);return}
    password=pw;storeSet(pw);m.textContent="";applyRemote(r.bookings);showApp();render();setSync("마지막으로 불러온 시각 "+stamp());
  }catch(e){m.className="msg err";m.textContent=errText(e)}finally{b.disabled=false}
}

let lastPts=[],pinLayer=null;
const HOTEL_RE=/호텔|호스텔|숙소|아파트먼트|레지던스|센트럴 하우스|Hotel|Hostel|Apartments|Residence|Cerise|PLUS Florence|The People|Central House|TOC Hostel|Barabas|Windrose/i;
const isHotelStop=s=>HOTEL_RE.test((s.name||"")+" "+(s.query||""));
const PIN_SVG='<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 2C8.4 2 3 7.4 3 14c0 8.6 12 24 12 24s12-15.4 12-24C27 7.4 21.6 2 15 2z" fill="#dc2626" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14" r="4.6" fill="#fff"/></svg>';
function drawPins(){   // 겹치는 핀은 화면에서 서로 안 가리게 벌려 표시. 숙소는 번호 없는 빨간 핀 하나로 합쳐 표시
  if(!LM)return;
  if(!pinLayer)pinLayer=L.layerGroup().addTo(LM);
  pinLayer.clearLayers();
  const items=[],hotels=[];
  lastPts.forEach(p=>{
    if(p.approx){items.push({p,hotel:false});return}
    if(isHotelStop(p.s)){   // 같은 숙소(이름이 같거나 150m 안)는 핀 하나로 합침
      const nm=String(p.s.name||"").replace(/\s+/g,"").toLowerCase();
      if(hotels.some(h=>h.nm===nm||hav(h.c,p.c)<0.15))return;
      hotels.push({nm,c:p.c});items.push({p,hotel:true});
    }else items.push({p,hotel:false});
  });
  if(!items.length)return;
  const R=31,HY=23,placed=[];   // HY: 빨간 핀은 뾰족한 끝이 실제 위치, 둥근 머리는 그 위
  const ring=[[0,0]];for(let r=1;r<=8;r++){const k=6+r*3;for(let j=0;j<k;j++){const t=2*Math.PI*j/k-Math.PI/2;ring.push([Math.cos(t)*R*r*.9,Math.sin(t)*R*r*.9])}}
  items.forEach(it=>{
    const p=it.p,yo=it.hotel?-HY:0,base=LM.latLngToContainerPoint(p.c);let pos=L.point(base.x,base.y+yo);
    for(const [dx,dy] of ring){const q=L.point(base.x+dx,base.y+dy+yo);if(placed.every(o=>o.distanceTo(q)>=R)){pos=q;break}}
    placed.push(pos);
    const tip=L.point(pos.x,pos.y-yo),moved=tip.distanceTo(base)>2,at=moved?LM.containerPointToLatLng(tip):p.c;
    if(moved){
      L.polyline([p.c,at],{color:"#334155",weight:1.5,opacity:.8}).addTo(pinLayer);
      L.circleMarker(p.c,{radius:3,color:"#fff",weight:1.5,fillColor:"#334155",fillOpacity:1}).addTo(pinLayer);
    }
    const ic=it.hotel?L.divIcon({className:"",html:PIN_SVG,iconSize:[30,40],iconAnchor:[15,38]})
                     :L.divIcon({className:"",html:'<div class="lm'+(p.approx?' q':'')+'">'+(p.i+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
    const m=L.marker(at,{icon:ic,title:(it.hotel?"숙소 · ":(p.i+1)+". ")+p.s.name,zIndexOffset:(it.hotel?500:1000)+p.i}).addTo(pinLayer);
    const tt=document.createElement("span");tt.textContent=(it.hotel?"🏨 ":"")+p.s.name+(p.approx?" (대략 위치)":"");m.bindTooltip(tt,{direction:"top",offset:[0,it.hotel?-34:-14]});
    m.on("click",()=>goStop(p.i));
  });
}

  for(let a0=0;a0<n-1;a0+=9){const ch=d.s.slice(a0,a0+10),a=document.createElement("a");a.className="ib";a.target="_blank";a.rel="noopener";
    a.href="https://www.google.com/maps/dir/?api=1&origin="+q(ch[0])+"&destination="+q(ch[ch.length-1])+(ch.length>2?"&waypoints="+ch.slice(1,-1).map(q).join("%7C"):"");
    a.textContent="구글 지도로 동선 열기 · "+(a0+1)+"~"+(a0+ch.length)+"번"+(ch.length>1?" (구글 지도 A="+(a0+1)+"번 … "+String.fromCharCode(64+ch.length)+"="+(a0+ch.length)+"번)":"");gl.append(a)}
  if(miss)geocodeMissing();
  if(!LM)return;
  lmLayer.clearLayers();if(!pts.length)return;
  const ls=pts.map(p=>p.c);
  L.polyline(ls,{color:"#ffffff",weight:8,opacity:.9}).addTo(lmLayer);
  L.polyline(ls,{color:"#1d4ed8",weight:4,opacity:.95,dashArray:"2 9",lineCap:"round"}).addTo(lmLayer);
  lastPts=pts.concat(apx).sort((x,y)=>x.i-y.i);
  let fit=ls;   // 도시 간 이동일: 점이 가장 많이 모인 도시 쪽을 기본 화면으로 (축소하면 전체 선이 보임)
  if(ls.length>2){let best=[];ls.forEach(a=>{const g=ls.filter(b=>hav(a,b)<60);if(g.length>best.length)best=g});
    if(best.length<ls.length&&best.length>=2)fit=best}
  if(fit.length===1)LM.setView(fit[0],15);else LM.fitBounds(L.latLngBounds(fit),{padding:[40,40],maxZoom:16});
  drawPins();
}

/* ---------- 숙소 기준 최적 동선 ---------- */
const TRANS=/공항|역$|터미널|정류장|버스|Station|Airport|Gare |Gare$|Estaci|Terminal|Autobus/i;
const LODGE=/호텔|호스텔|숙소|아파트|레지던스|하우스|바이필로우|아테나스|Hotel|Hostel|Apartments|Residence|BYPILLOW|Cerise|Atenas|Room00|The People/i;
const txt=x=>x.name+" "+(x.query||"");
const isT=x=>TRANS.test(x.name)||TRANS.test(x.query||""),isL=x=>!isT(x)&&LODGE.test(txt(x));
const fmtKm=k=>k<1?Math.round(k*1000)+"m":k.toFixed(1)+"km";
function pathLen(arr){let t=0,prev=null;arr.forEach(x=>{const c=ll(x);if(!c)return;if(prev)t+=hav(prev,c);prev=c});return t}
function solveOrder(sC,mC,eC){
  const n=mC.length;if(n<=1)return mC.map((_,i)=>i);
  const D=mC.map(a=>mC.map(b=>hav(a,b))),S0=mC.map(c=>hav(sC,c)),E0=mC.map(c=>hav(c,eC));
  if(n<=16){
    const N=1<<n,INF=1e18,dp=new Float64Array(N*n).fill(INF),par=new Int8Array(N*n).fill(-1);
    for(let j=0;j<n;j++)dp[(1<<j)*n+j]=S0[j];
    for(let m=1;m<N;m++)for(let j=0;j<n;j++){
      if(!(m&(1<<j)))continue;const cur=dp[m*n+j];if(cur>=INF)continue;
      for(let k=0;k<n;k++){if(m&(1<<k))continue;const nm=m|(1<<k),v=cur+D[j][k];if(v<dp[nm*n+k]){dp[nm*n+k]=v;par[nm*n+k]=j}}}
    let bj=0,bv=INF;for(let j=0;j<n;j++){const v=dp[(N-1)*n+j]+E0[j];if(v<bv){bv=v;bj=j}}
    const out=[];let m=N-1,j=bj;while(j>=0){out.push(j);const pj=par[m*n+j];m^=(1<<j);j=pj}
    return out.reverse();
  }
  let arr=[],left=new Set(mC.map((_,i)=>i)),cur=-1;
  while(left.size){let b=-1,bv=1e18;left.forEach(i=>{const d=cur<0?S0[i]:D[cur][i];if(d<bv){bv=d;b=i}});arr.push(b);left.delete(b);cur=b}
  const cost=a=>{let t=S0[a[0]];for(let i=1;i<a.length;i++)t+=D[a[i-1]][a[i]];return t+E0[a[a.length-1]]};
  let imp=true,best=cost(arr);
  while(imp){imp=false;for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++){const t=arr.slice(0,i).concat(arr.slice(i,j+1).reverse(),arr.slice(j+1)),c=cost(t);if(c<best-1e-9){arr=t;best=c;imp=true}}}
  return arr;
}
function planOpt(d){
  const st=d.s;if(st.length<4)return{err:"장소가 4곳 이상일 때 계산해요. 이 날은 순서를 바꿀 게 거의 없어요."};
  let a=0;while(a<st.length&&isT(st[a]))a++;
  let z=st.length;while(z>a&&isT(st[z-1]))z--;
  const L=st.slice(0,a),T=st.slice(z),rest=st.slice(a,z);
  if(rest.some(isT))return{err:"중간에 역·공항·터미널이 끼어 있어요. 자동으로 바꾸면 이동 순서가 꼬일 수 있어서, 이런 날은 직접 순서를 바꿔 주세요."};
  let S=null,E=null,anchor=null;
  if(isL(rest[0]))S=rest[0];
  else if(L.length)anchor=L[L.length-1];
  else return{err:"이 날은 숙소에서 시작하지 않아서 출발점을 정할 수 없어요."};
  const last=rest[rest.length-1];
  if(S){if(rest.length>1&&isL(last)&&last.query!==S.query)E=last}
  else{if(isL(last))E=last;else return{err:"도착할 숙소를 찾지 못했어요. 직접 순서를 바꿔 주세요."}}
  const startStop=S||anchor,closed=!E,endStop=E||S;
  const sC=ll(startStop),eC=ll(endStop);
  if(!sC||!eC)return{err:"숙소나 출발 장소의 위치를 몰라서 계산할 수 없어요."};
  const skip=new Set([S,E].filter(Boolean)),dupq=new Set([S&&S.query,E&&E.query].filter(Boolean));
  const mids=rest.filter(x=>!skip.has(x)&&!dupq.has(x.query));
  const withC=mids.filter(x=>ll(x)),noC=mids.filter(x=>!ll(x));
  if(hav(sC,eC)>40||withC.some(x=>hav(sC,ll(x))>60))return{err:"도시를 옮기는 날이라 숙소 왕복 동선이 맞지 않아요. 이런 날은 직접 순서를 바꿔 주세요."};
  if(withC.length<2)return{err:"순서를 바꿀 장소가 2곳 이상 필요해요."};
  const ord=solveOrder(sC,withC.map(ll),eC).map(i=>withC[i]);
  const strip=x=>{const o=Object.assign({},x);delete o.time;return o};
  const tail=closed?[Object.assign(strip(S),{memo:"숙소로 복귀"})]:[strip(E)];
  const next=[...L,...(S?[strip(S)]:[]),...ord.map(strip),...noC.map(strip),...tail,...T];
  const needBack=closed&&rest[rest.length-1].query!==S.query,a0=anchor?[anchor]:[];
  const beforeSeg=[...a0,...rest,...(needBack?[S]:[])],afterSeg=[...a0,...(S?[S]:[]),...ord,...noC,...tail];
  return{next,before:pathLen(beforeSeg),after:pathLen(afterSeg),closed,noC:noC.length,hadTime:st.some(x=>x.time),dup:rest.length-mids.length-(S?1:0)-(E?1:0)}
}
$("optbtn").onclick=()=>{
  const box=$("optbox"),d=D();box.textContent="";box.hidden=false;
  const r=planOpt(d);
  if(r.err){const e=document.createElement("div");e.textContent=r.err;box.append(e);return}
  const h=document.createElement("b");h.textContent="Day "+d.n+" 숙소 기준 최적 동선 제안";
  const sm=document.createElement("div");
  const diff=r.before-r.after;
  sm.textContent=(r.closed?"숙소에서 출발해 숙소로 돌아오는 순서예요. ":"숙소에서 출발해 도착 숙소로 가는 순서예요. ")+"직선 거리 합계 "+fmtKm(r.before)+(r.closed?"(숙소 복귀 포함)":"")+" → "+fmtKm(r.after)+(diff>0.05?" ("+fmtKm(diff)+" 줄어요)":diff<-0.05?" (지금 순서가 더 짧지만, 동선이 겹치지 않게 정리한 순서예요)":" (거의 같아요)")+".";
  const ol=document.createElement("ol");r.next.forEach(x=>{const li=document.createElement("li");li.textContent=x.name;ol.append(li)});
  const note=document.createElement("small");
